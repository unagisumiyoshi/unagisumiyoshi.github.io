<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>お知らせ</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&amp;family=Sawarabi+Mincho&amp;display=swap" rel="stylesheet"/>

</head>
<body>
  <!-- 下から出るメニュー（共通） -->
  <div id="menu-placeholder"></div>
  <!-- ヘッダー（共通） -->
  <div id="header-placeholder"></div>

  <!-- ページタイトル（共通スタイル） -->
  <div class="page-header">
    <h2 class="page-title">お知らせ</h2>
  </div>

  <!-- お知らせ一覧本体 -->
  <section class="section news-page">
    <div class="news-intro">
      <p>
        臨時休業や営業時間の変更、季節のおすすめなど、<br/>
        当店からのお知らせを掲載しております。
      </p>
    </div>

    <!-- ★トップページからも参照する一覧エリア -->
    <div class="news-container" id="top-news">
      <div class="news-item">
        <div class="news-title">2025/10/26 … 年末年始の営業について</div>
        <div class="news-content">
          年末は12月30日まで営業いたしますが、12月29日は夜のみ休業とさせていただきます。<br/>
          年始は1月3日より営業いたします<br/>
          営業カレンダーをご確認ください
        </div>
      </div>

      <div class="news-item">
        <div class="news-title">2025/10/26 … 公式ホームページを開設しました</div>
        <div class="news-content">
          うなぎの宿 住吉 公式ホームページをご覧いただきありがとうございます。<br/>
          メニューや営業情報を随時更新してまいります。
        </div>
      </div>

      <!-- ここに今後のお知らせを追加していく -->
    </div>
  </section>

  <!-- 共通フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>© うなぎの宿 住吉</p>
      <p>長野県長野市箱清水2丁目19-31</p>
      <p>TEL：026-232-6304</p>
    </div>
  </footer>

  <!-- 共通JS -->
  <script src="main.js"></script>

  <!-- ページトップへ戻るボタン（他ページと同じ） -->
  <button type="button" class="back-to-top-btn" aria-label="ページの先頭へ戻る">
    ▲
  </button>
</body>
</html>
